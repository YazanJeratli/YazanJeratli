<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="index.html">&larr; All games</a>
  <h1>⭕ Tic-Tac-Toe</h1>

  <div class="scoreboard">
    <div>❌ Player 1<span class="score-value" id="scoreX">0</span></div>
    <div>Ties<span class="score-value" id="scoreT">0</span></div>
    <div>⭕ Player 2<span class="score-value" id="scoreO">0</span></div>
  </div>

  <div class="card">
    <div class="status" id="status">Player 1's turn (❌)</div>
    <div class="ttt-board" id="board"></div>
    <div class="controls">
      <button id="newRound">New Round</button>
      <button class="secondary" id="resetScores">Reset Scores</button>
    </div>
  </div>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6],
    ];

    let cells = Array(9).fill(null);
    let current = "X";
    let gameOver = false;
    const scores = { X: 0, O: 0, T: 0 };

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const scoreXEl = document.getElementById("scoreX");
    const scoreOEl = document.getElementById("scoreO");
    const scoreTEl = document.getElementById("scoreT");

    function label(mark) {
      return mark === "X" ? "Player 1 (❌)" : "Player 2 (⭕)";
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      cells.forEach((val, i) => {
        const btn = document.createElement("button");
        btn.className = "ttt-cell";
        btn.textContent = val ? (val === "X" ? "❌" : "⭕") : "";
        btn.disabled = !!val || gameOver;
        btn.addEventListener("click", () => handleMove(i));
        boardEl.appendChild(btn);
      });
    }

    function handleMove(i) {
      if (cells[i] || gameOver) return;
      cells[i] = current;
      const winLine = checkWin();
      if (winLine) {
        gameOver = true;
        scores[current]++;
        updateScores();
        statusEl.textContent = `${label(current)} wins! 🎉`;
        highlightWin(winLine);
        renderBoard();
        return;
      }
      if (cells.every(Boolean)) {
        gameOver = true;
        scores.T++;
        updateScores();
        statusEl.textContent = "It's a tie! 🤝";
        renderBoard();
        return;
      }
      current = current === "X" ? "O" : "X";
      statusEl.textContent = `${label(current)}'s turn`;
      renderBoard();
    }

    function checkWin() {
      return WIN_LINES.find(
        ([a, b, c]) => cells[a] && cells[a] === cells[b] && cells[a] === cells[c]
      );
    }

    function highlightWin(line) {
      renderBoard();
      line.forEach((i) => boardEl.children[i].classList.add("win"));
    }

    function updateScores() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreTEl.textContent = scores.T;
    }

    function newRound() {
      cells = Array(9).fill(null);
      current = "X";
      gameOver = false;
      statusEl.textContent = `${label(current)}'s turn`;
      renderBoard();
    }

    document.getElementById("newRound").addEventListener("click", newRound);
    document.getElementById("resetScores").addEventListener("click", () => {
      scores.X = 0;
      scores.O = 0;
      scores.T = 0;
      updateScores();
      newRound();
    });

    renderBoard();
  </script>
</body>
</html>
